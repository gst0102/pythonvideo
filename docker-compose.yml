services:
  # ========================================
  # FastAPI application
  # ========================================
  app:
    image: ${APP_IMAGE:-pythonvideo-app:stage2-local}
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: ${PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT:-1200000}
        APP_VERSION: ${APP_VERSION:-local}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: video-service-app
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # PostgreSQL
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@postgres:5432/agent}
      - DB_ECHO=${DB_ECHO:-false}
      - DB_SSL_MODE=${DB_SSL_MODE:-prefer}
      # App
      - DOMAIN=${DOMAIN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - NOTIFY_URL=${NOTIFY_URL:-}
      - CRAWLER_WORKER_URL=${CRAWLER_WORKER_URL:-http://crawler-worker:8010}
      # Proxy / Cookie
      - PROXY_URL=${PROXY_URL:-}
      - COOKIE_FILE=${COOKIE_FILE:-}
      # WeChat
      - APPID=${APPID:-${WECHAT_APPID:-}}
      - SECRET=${SECRET:-${WECHAT_SECRET:-}}
      - WECHAT_APPID=${WECHAT_APPID:-${APPID:-}}
      - WECHAT_SECRET=${WECHAT_SECRET:-${SECRET:-}}
      # WeChat virtual payment
      - VIRTUAL_PAY_APPID=${VIRTUAL_PAY_APPID:-${APPID:-}}
      - VIRTUAL_PAY_OFFER_ID=${VIRTUAL_PAY_OFFER_ID:-}
      - VIRTUAL_PAY_ENV=${VIRTUAL_PAY_ENV:-0}
      - VIRTUAL_PAY_MODE=${VIRTUAL_PAY_MODE:-short_series_coin}
      - VIRTUAL_PAY_CURRENCY=${VIRTUAL_PAY_CURRENCY:-CNY}
      - VIRTUAL_PAY_SANDBOX_APP_KEY=${VIRTUAL_PAY_SANDBOX_APP_KEY:-}
      - VIRTUAL_PAY_PROD_APP_KEY=${VIRTUAL_PAY_PROD_APP_KEY:-}
      - VIRTUAL_PAY_APP_KEY=${VIRTUAL_PAY_APP_KEY:-}
      - VIRTUAL_PAY_NOTIFY_URL=${VIRTUAL_PAY_NOTIFY_URL:-}
      - VIRTUAL_PAY_NOTIFY_TOKEN=${VIRTUAL_PAY_NOTIFY_TOKEN:-${PAY_NOTIFY_TOKEN:-}}
      - PAY_NOTIFY_TOKEN=${PAY_NOTIFY_TOKEN:-${VIRTUAL_PAY_NOTIFY_TOKEN:-}}
      # Other secrets
      - SECRET_KEY=${SECRET_KEY:-}
      - API_KEY=${API_KEY:-}
    volumes:
      - ./image:/app/image
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./output:/app/output
      - ./certs:/app/certs:ro
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ========================================
  # Browser crawler worker
  # ========================================
  crawler-worker:
    image: ${CRAWLER_IMAGE:-pythonvideo-crawler:stage2-local}
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler-runtime
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: ${PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT:-1200000}
        APP_VERSION: ${APP_VERSION:-local}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: video-service-crawler-worker
    shm_size: ${CRAWLER_WORKER_SHM_SIZE:-256m}
    expose:
      - "8010"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@postgres:5432/agent}
      - DB_ECHO=${DB_ECHO:-false}
      - DB_SSL_MODE=${DB_SSL_MODE:-prefer}
      - PROXY_URL=${PROXY_URL:-}
      - COOKIE_FILE=${COOKIE_FILE:-}
      - BROWSER_AUTOMATION_CONCURRENCY=${BROWSER_AUTOMATION_CONCURRENCY:-1}
      - BROWSER_AUTOMATION_QUEUE_TIMEOUT=${BROWSER_AUTOMATION_QUEUE_TIMEOUT:-120}
      - BROWSER_FORCE_CLEANUP=${BROWSER_FORCE_CLEANUP:-true}
      - CRAWLER_BROWSER_STALE_SECONDS=${CRAWLER_BROWSER_STALE_SECONDS:-300}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium}
      - ANIME_SYNC_ENABLED=${ANIME_SYNC_ENABLED:-true}
      - ANIME_SYNC_INTERVAL=${ANIME_SYNC_INTERVAL:-60}
      - KDOCS_SYNC_LIMIT_PER_TYPE=${KDOCS_SYNC_LIMIT_PER_TYPE:-20}
      - LINUXDO_SYNC_ENABLED=${LINUXDO_SYNC_ENABLED:-true}
      - LINUXDO_SYNC_INTERVAL_HOURS=${LINUXDO_SYNC_INTERVAL_HOURS:-12}
      - LINUXDO_SYNC_PAGES=${LINUXDO_SYNC_PAGES:-1}
      - LINUXDO_SYNC_LIMIT=${LINUXDO_SYNC_LIMIT:-20}
      - LINUXDO_STATE_FILE=${LINUXDO_STATE_FILE:-/app/storage/linuxdo_storage_state.json}
      - LINUXDO_OUTPUT_DIR=${LINUXDO_OUTPUT_DIR:-/app/output}
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./output:/app/output
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ========================================
  # Nginx reverse proxy
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: video-service-nginx
    # If the host machine already serves 80/443 with another nginx,
    # keep ports commented and reverse-proxy to app:8000 from the host nginx.
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./www/certbot:/var/www/certbot:ro
      - ./image:/usr/share/nginx/html/image:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ========================================
  # SSL certificate auto-renewal
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: video-service-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done;'"
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ========================================
  # Redis cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: video-service-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ========================================
  # PostgreSQL database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: video-service-postgres
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
