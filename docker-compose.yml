services:
  # ========================================
  # FastAPI 应用
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-service-app
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      # ── Redis ──
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # ── PostgreSQL ──
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@postgres:5432/agent}
      - DB_ECHO=${DB_ECHO:-false}
      - DB_SSL_MODE=${DB_SSL_MODE:-prefer}
      # ── 应用 ──
      - DOMAIN=${DOMAIN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - NOTIFY_URL=${NOTIFY_URL:-}
      # ── 代理 / Cookie ──
      - PROXY_URL=${PROXY_URL:-}
      - COOKIE_FILE=${COOKIE_FILE:-}
      # ── 番剧同步 ──
      - ANIME_SYNC_ENABLED=${ANIME_SYNC_ENABLED:-true}
      - ANIME_SYNC_INTERVAL=${ANIME_SYNC_INTERVAL:-15}
      # ── 微信配置 ──
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      # ── 其他密钥 ──
      - SECRET_KEY=${SECRET_KEY:-}
      - API_KEY=${API_KEY:-}
    volumes:
      # 数据持久化目录
      - ./image:/app/image
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      # 证书 (只读)
      - ./certs:/app/certs:ro
      # Cookie 文件
      # - ./cookies.txt:/app/cookies.txt
      # 备用 cookie（服务器上才有的文件，本地部署请注释此行）
      # - ./cookies.txt.dan:/app/cookies.txt.dan:ro
      # 环境变量 (只读)
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ========================================
  # Nginx 反向代理
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: video-service-nginx
    # ⚠️ 如果服务器宿主机已有 nginx 占用 80/443，注释掉 ports
    # 改为在宿主机 nginx 里配置反向代理到 app:8000
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./www/certbot:/var/www/certbot:ro
      - ./image:/usr/share/nginx/html/image:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ========================================
  # SSL 证书自动续期 (Let's Encrypt)
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: video-service-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done;'"
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ========================================
  # Redis 缓存
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: video-service-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ========================================
  # PostgreSQL 数据库
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: video-service-postgres
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ========================================
# 持久化存储
# ========================================
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
