# Alembic 数据库迁移配置文件
# 运行命令示例:
#   alembic revision --autogenerate -m "init tables"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .

# 下面的 URL 仅作为占位符，实际运行时由 migrations/env.py 从环境变量 DATABASE_URL 读取
# 用法: DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
